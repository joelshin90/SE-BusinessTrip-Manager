const holidayGroupName = (name) => {
  const n=String(name||'').trim();

  if (/신정/.test(n)) return '신정';
  if (/노동절/.test(n)) return '노동절';
  if (/추석|중추절/.test(n)) return '추석 / 중추절';
  if (/삼일절/.test(n)) return '삼일절';
  if (/광복절/.test(n)) return '광복절';
  if (/개천절/.test(n)) return '개천절';
  if (/한글날/.test(n)) return '한글날';
  if (/제헌절/.test(n)) return '제헌절';
  if (/부처님오신날/.test(n)) return '부처님오신날';
  if (/성탄절/.test(n)) return '성탄절';
  return n;
};
const holidayKey = (h) => h.date.slice(0,4)+'|'+holidayGroupName(h.name);
function groupedHolidays(yr){
  const groups=new Map();
  db.holidays.filter(h=>h.date.startsWith(yr)).forEach(h=>{
    let key=holidayKey(h);
    if(!groups.has(key))groups.set(key,{key,year:yr,name:holidayGroupName(h.name),KR:[],CN:[]});
    groups.get(key)[h.country]?.push(h);
  });
  return [...groups.values()].sort((a,b)=>{
    const first=x=>[...x.KR,...x.CN].map(h=>h.date).sort()[0]||'9999';
    return first(a).localeCompare(first(b))||a.name.localeCompare(b.name);
  });
}
function compressedHolidayDates(items){
  let dates=[...new Set(items.map(x=>x.date))].sort();
  if(!dates.length)return '—';
  let groups=[],a=dates[0],b=a;
  for(let i=1;i<dates.length;i++){
    if(dates[i]===addDays(b,1)){b=dates[i]}else{groups.push(a===b?a:a+' ~ '+b);a=b=dates[i]}
  }
  groups.push(a===b?a:a+' ~ '+b);
  return groups.join(', ');
}

function parseHolidayDates(input){
  let tokens=input.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean),days=new Set();
  for(let token of tokens){
    let m=token.match(/^(\d{4}-\d{2}-\d{2})(?:\s*(?:~|부터|—|–)\s*(\d{4}-\d{2}-\d{2}))?$/);
    if(!m)throw Error('날짜 형식을 확인하세요: '+token);
    const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(dateObj(s).getTime())&&dateObj(s).getFullYear()===Number(s.slice(0,4))&&dateObj(s).getMonth()+1===Number(s.slice(5,7))&&dateObj(s).getDate()===Number(s.slice(8,10));
    let a=m[1],b=m[2]||a;
    if(!valid(a)||!valid(b)||b<a||diff(a,b)>45)throw Error('날짜 범위를 확인하세요: '+token);
    for(let d=a;d<=b;d=addDays(d,1))days.add(d);
  }
  return [...days].sort();
}
function editHolidayGroup(key=''){
  let g=groupedHolidays((key||'').slice(0,4)||window.holYear||'2026').find(x=>x.key===key);
  let name=g?.name||'',year=g?.year||window.holYear||'2026';
  openModal(key?'통합 공휴일 수정':'통합 공휴일 추가',`<p class="muted">한 명절을 하나로 관리하며, <b>국가별 휴무기간은 따로 입력</b>합니다. 한 국가만 쉬는 경우 다른 칸은 비워 두세요.</p><form id="unifiedHolidayForm" class="formgrid" onsubmit="event.preventDefault()">
    ${field('명절 / 공휴일명','name','text',name)}${field('연도','year','number',year,'min="2020" max="2100"')}
    <label class="field full">🇰🇷 KR 휴무 날짜<textarea name="krDates" rows="3" placeholder="2026-02-16 ~ 2026-02-18">${esc(dateEditorText(g?.KR||[]))}</textarea><small class="muted">하루: 2026-01-01 / 기간: 2026-02-16 ~ 2026-02-18 / 여러 구간: 쉼표로 구분</small></label>
    <label class="field full">🇨🇳 CN 휴무 날짜<textarea name="cnDates" rows="3" placeholder="2026-02-15 ~ 2026-02-23">${esc(dateEditorText(g?.CN||[]))}</textarea><small class="muted">한국과 날짜가 겹쳐도 별도 저장되며, 각 나라의 기간을 다르게 입력할 수 있습니다.</small></label>
    ${selectField('등록 상태','status',[['확정','확정'],['예정','예정/검토중'],['임시','임시공휴일']],g?.KR[0]?.status||g?.CN[0]?.status||'확정')}
    <div class="tools full"><button class="btn primary" type="button" onclick="saveHolidayGroup(${JSON.stringify(key)})">KR / CN 함께 저장</button>${key?`<button class="btn danger" type="button" onclick="removeHolidayGroup(${JSON.stringify(key)})">명절 전체 삭제</button>`:''}<button class="btn" type="button" onclick="closeModal()">취소</button></div>
  </form>`);
}
function saveHolidayGroup(key=''){
  let f=document.getElementById('unifiedHolidayForm');if(!f.reportValidity())return;
  let x=Object.fromEntries(new FormData(f).entries()),name=x.name.trim(),year=x.year;
  try{
    if(!name)throw Error('공휴일명을 입력해 주세요.');
    let kr=parseHolidayDates(x.krDates),cn=parseHolidayDates(x.cnDates);
    if(!kr.length&&!cn.length)throw Error('KR 또는 CN 날짜를 한 개 이상 입력해 주세요.');
    if([...kr,...cn].some(d=>!d.startsWith(year)))throw Error('입력한 날짜의 연도와 명절 연도가 일치해야 합니다.');
    let newKey=year+'|'+holidayGroupName(name);
    if(db.holidays.some(h=>holidayKey(h)===newKey&&holidayKey(h)!==key))throw Error('같은 이름의 명절이 이미 있습니다. 기존 행에서 수정해 주세요.');
    let other=db.holidays.filter(h=>holidayKey(h)!==key);
    db.holidays=[...other,...kr.map(date=>({id:id(),date,country:'KR',name,status:x.status})),...cn.map(date=>({id:id(),date,country:'CN',name,status:x.status}))];
    save();closeModal();render();
  }catch(e){alert(e.message)}
}
function removeHolidayGroup(key){
  if(!confirm('이 명절의 KR / CN 날짜를 모두 삭제할까요?'))return;
  db.holidays=db.holidays.filter(h=>holidayKey(h)!==key);save();closeModal();render();
}
function bulkHoliday(){openModal('공휴일 일괄 입력',`<p class="muted">기존 날짜 단위 자료도 붙여넣을 수 있습니다. 동일한 이름은 저장 후 통합 행으로 표시됩니다. 형식: YYYY-MM-DD[탭]공휴일명</p><div class="formgrid">${selectField('국가','country',[['KR','한국'],['CN','중국']],'KR')}<label class="field full">붙여넣을 데이터<textarea id="bulkInput" style="min-height:180px" placeholder="2027-01-01\t신정"></textarea></label><button class="btn primary" type="button" onclick="saveBulkHoliday()">목록에 추가</button></div>`)}
function saveBulkHoliday(){let country=document.querySelector('#modal select[name=country]').value,s=document.getElementById('bulkInput').value,n=0;for(let line of s.split(/\r?\n/)){let [date,name]=line.split(/\t|,/).map(x=>x?.trim());if(!/^\d{4}-\d\d-\d\d$/.test(date||'')||!name)continue;if(db.holidays.some(h=>h.country===country&&h.date===date&&holidayGroupName(h.name)===holidayGroupName(name)))continue;db.holidays.push({id:id(),date,country,name,status:'확정'});n++}save();closeModal();render();alert(`${n}건 추가했습니다.`)}
function addWorkday(){let date=prompt('조정 근무일 YYYY-MM-DD');if(!/^\d{4}-\d\d-\d\d$/.test(date||''))return;if(db.workdays.some(w=>w.date===date))return alert('이미 등록된 날짜입니다.');db.workdays.push({id:id(),country:'CN',date,name:'조정 근무일'});save();render()}
function removeWorkday(key){db.workdays=db.workdays.filter(x=>x.id!==key);save();render()}
let draggingPersonId=null;
function personDragStart(event){const tr=event.target.closest('tr[data-person-id]');if(!tr)return;draggingPersonId=tr.dataset.personId;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggingPersonId);tr.classList.add('person-dragging');}
function personDragOver(event){const tr=event.target.closest('tr[data-person-id]');if(!tr||!draggingPersonId)return;event.preventDefault();event.dataTransfer.dropEffect='move';document.querySelectorAll('.person-drag-over').forEach(el=>el.classList.remove('person-drag-over'));if(tr.dataset.personId!==draggingPersonId)tr.classList.add('person-drag-over');}
function personDrop(event){const tr=event.target.closest('tr[data-person-id]');if(!tr||!draggingPersonId)return;event.preventDefault();const source=draggingPersonId,target=tr.dataset.personId;personDragEnd();if(source===target)return;const srcIndex=db.people.findIndex(p=>p.id===source);const dstIndex=db.people.findIndex(p=>p.id===target);if(srcIndex<0||dstIndex<0)return;const [moved]=db.people.splice(srcIndex,1);db.people.splice(dstIndex,0,moved);savePeopleOrder();}
function personDragEnd(){draggingPersonId=null;document.querySelectorAll('.person-dragging,.person-drag-over').forEach(el=>el.classList.remove('person-dragging','person-drag-over'));}
function personMove(pid,direction){let i=db.people.findIndex(p=>p.id===pid);let next=i+direction;if(i<0||next<0||next>=db.people.length)return;[db.people[i],db.people[next]]=[db.people[next],db.people[i]];savePeopleOrder();}
function savePeopleOrder(){db.people.forEach((p,i)=>{p.sortOrder=i+1});save();render();}
function renderSettings(){return `<div class="grid2"><div class="panel"><div class="tools" style="justify-content:space-between"><div><h3>직원 관리</h3><p class="muted" style="margin:4px 0">맨 오른쪽 ☰ 아이콘을 잡고 위아래로 옮기면 직원 표시 순서가 Firebase에 저장됩니다. 방향 버튼도 사용할 수 있어요.</p></div><button class="btn primary" onclick="editPerson()">+ 직원 추가</button></div><table class="tbl" id="peopleOrderTable"><thead><tr><th style="width:55px">순서</th><th>이름</th><th>팀</th><th>기준 근무지</th><th>담당</th><th>작업</th><th style="width:65px;text-align:center">이동</th></tr></thead><tbody>${db.people.map((p,i)=>`<tr class="person-sort-row" data-person-id="${esc(p.id)}" ondragstart="personDragStart(event)" ondragover="personDragOver(event)" ondrop="personDrop(event)" ondragend="personDragEnd(event)"><td><span class="sort-position">${i+1}</span></td><td><b>${esc(p.name)}</b></td><td>${esc(p.team)}</td><td>${esc(p.homeRegionId||(p.country==='CN'?'CN 미지정':'KR'))}</td><td>${esc(p.role)}</td><td style="white-space:nowrap"><button class="btn small" onclick="personMove('${p.id}',-1)" title="한 칸 위" ${i===0?'disabled':''}>↑</button> <button class="btn small" onclick="personMove('${p.id}',1)" title="한 칸 아래" ${i===db.people.length-1?'disabled':''}>↓</button> <button class="btn small" onclick="editPerson('${p.id}')">편집</button></td><td style="text-align:center"><span class="drag-handle" draggable="true" aria-label="${esc(p.name)} 순서 이동" title="잡고 위아래로 이동">☰</span></td></tr>`).join('')}</tbody></table>${!db.people.length?'<div class="empty">직원을 추가해주세요.</div>':''}</div><div class="panel"><h3>Firebase 공용 데이터 연결</h3><p class="muted">GitHub Pages + Firebase Realtime Database (인증 필수). 연결 전에는 안전한 데모 모드로 동작합니다.</p><p><strong id="syncState">${esc(syncStatus)}</strong></p><div class="formgrid"><label class="field">Realtime Database URL<input id="firebaseURL" type="text" placeholder="https://example-default-rtdb.asia-southeast1.firebasedatabase.app" value="${esc(firebaseConfig.dbURL)}"></label><label class="field">Firebase Web API Key<input id="firebaseKey" type="text" value="${esc(firebaseConfig.apiKey)}" placeholder="Firebase 프로젝트 설정의 Web API Key"></label><label class="field">DB 경로<input id="firebasePath" type="text" value="${esc(firebaseConfig.path)}"></label><label class="field">로그인 이메일<input id="firebaseEmail" type="email" autocomplete="username" value="${esc(authEmail)}"></label><label class="field">비밀번호<input id="firebasePassword" type="password" autocomplete="current-password" placeholder="Firebase Authentication 사용자"></label></div><div class="tools" style="margin-top:12px"><button class="btn primary" onclick="connectFirebase()">연결 / 로그인</button><button class="btn" onclick="refreshRemote()">새로고침</button><button class="btn" onclick="initializeRemote()">현재 데이터 최초 업로드</button><button class="btn danger" onclick="disconnectFirebase()">연결 해제</button></div><p class="muted">※ 공용 DB 연결 시 현재 브라우저 데이터를 자동 업로드하지 않습니다. 운영 데이터에 연결하기 전에 JSON 백업을 권장합니다.</p><hr style="border:0;border-top:1px solid #e5edf5;margin:22px 0"><h3>데이터 백업 및 이전</h3><div class="tools"><button class="btn primary" onclick="exportJSON()">JSON 백업 다운로드</button><label class="btn">JSON 가져오기<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label></div><hr style="border:0;border-top:1px solid #e5edf5;margin:22px 0"><h3>관리 안내</h3><p>• 출장 기간은 시작일/종료일을 모두 포함하여 계산합니다.</p><p>• 중복 출장 기간은 등록할 수 있으며 인일 집계에 중복 반영될 수 있습니다.</p><p>• 공휴일은 출장일수에서 자동 제외하지 않습니다.</p><p>• 실제 팀 공유 서비스 운영 시 계정 인증과 클라우드 데이터베이스 연결이 필요합니다.</p><button class="btn danger" onclick="resetDB()">전체 데이터 초기화</button></div></div>`}function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='se-trip-manager-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importJSON(f){if(!f)return;try{let obj=JSON.parse(await f.text());if(!['sites','people','trips','reports','events','holidays'].every(k=>Array.isArray(obj[k])))throw Error('올바른 백업 파일이 아닙니다.');if(!confirm('현재 저장된 데이터를 백업 파일 내용으로 교체할까요?'))return;db=obj;db.workdays||=[];db.regions||=REGION_PRESETS.map(([code,name])=>({id:code,code,name}));save();render()}catch(e){alert('파일을 가져오지 못했습니다: '+e.message)}}function resetDB(){if(authToken){alert('공용 DB 연결 중에는 전체 초기화를 지원하지 않습니다. JSON 백업 후 개별 삭제해 주세요.');return}if(confirm('정말 모든 일정을 초기화할까요? 이 작업은 되돌릴 수 없습니다.')){db=seed();save();render()}}render();
</script><script src="trip-flight-map.js?v=1.8"></script></body></html>
